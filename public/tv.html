<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WebPhim TV</title>
<!-- ponytail: hls.js from CDN, bundle only if CDN unavailable on TV -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@0.14.17/dist/hls.min.js"></script>
<style>
*{margin:0;padding:0}
body{background:#0b0b09;color:#fff8e6;font-family:Arial,Helvetica,sans-serif;padding:0 0 50px}
h1{background:#111;padding:16px 20px;color:#ffd45a;font-size:22px}
h1 span{color:#fff}
h2{color:#ffd45a;font-size:17px;margin:14px 0 8px 14px}
.row{white-space:nowrap;overflow-x:auto;padding:0 10px 12px}
.card{display:inline-block;width:130px;margin-right:8px;vertical-align:top;cursor:pointer;color:#fff8e6}
.card img{width:100%;height:195px;object-fit:cover;border-radius:4px;background:#222;display:block}
.card .nm{font-size:12px;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .yr{font-size:11px;color:#ffd45a}
.loading,.err{text-align:center;padding:30px 20px;color:#888;font-size:14px}
.err{color:#ff6868}
#det{display:none;padding:10px 14px}
#det.show{display:block}
#det .bk{color:#ffd45a;font-size:15px;padding:8px 0;cursor:pointer;margin-bottom:8px}
#det .ps{width:130px;border-radius:4px;float:left;margin:0 14px 10px 0;background:#222}
#det h2{font-size:18px;margin:0 0 4px;color:#ffd45a;padding:0}
#det .mt{color:#b9ad91;font-size:12px;margin-bottom:10px}
#det .dc{color:#b9ad91;font-size:12px;line-height:1.5;margin-bottom:12px;clear:both}
#det .tg{margin-bottom:10px}
#det .tg span{display:inline-block;background:rgba(255,255,255,0.08);padding:3px 8px;border-radius:10px;font-size:11px;color:#b9ad91;margin:2px 2px 2px 0}
.sv{color:#ffd45a;font-size:14px;font-weight:700;margin:12px 0 4px}
.eg{overflow:hidden;margin-bottom:10px}
.ep{display:block;float:left;min-width:60px;padding:9px 14px;margin:3px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:4px;color:#fff8e6;font-size:12px;text-align:center;cursor:pointer}
#pw{display:none;position:fixed;inset:0;z-index:100;background:#000}
#pw.show{display:block}
#pw video{width:100%;height:100%;object-fit:contain}
#px{position:fixed;top:10px;left:10px;font-size:24px;color:#fff;cursor:pointer;padding:8px 12px;background:rgba(0,0,0,0.6);border-radius:4px;z-index:110;line-height:1}
</style>
</head>
<body>
<h1><span>Web</span>Phim</h1>
<div id="lst"></div>
<div id="det"></div>
<div id="pw"><video id="pl" playsinline></video><div id="px" onclick="xp()">✕</div></div>
<script>
var _hls = null

function xhr(url, cb) {
  try {
    var r = new XMLHttpRequest()
    r.open('GET', url, true)
    r.onreadystatechange = function() {
      if (r.readyState === 4) {
        if (r.status === 200) try { cb(null, JSON.parse(r.responseText)) } catch(e) { cb(e) }
        else cb(new Error('HTTP ' + r.status))
      }
    }
    r.send()
  } catch(e) { cb(e) }
}

function im(u) {
  if (!u) return ''
  if (u.indexOf('http://')===0||u.indexOf('https://')===0) return u
  if (u.indexOf('upload/')===0||u.indexOf('uploads/')===0) return 'https://phimimg.com/'+u
  return 'https://img.ophim.live/uploads/movies/'+u.replace(/^\//,'')
}

function es(s) {
  if (typeof s!=='string') return ''
  return s.replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})
}

var LS=[
  {t:'phim-moi-cap-nhat',l:'Phim Mới'},
  {t:'phim-bo',l:'Phim Bộ'},
  {t:'phim-le',l:'Phim Lẻ'},
  {t:'tv-shows',l:'TV Shows'}
]

function hm() {
  document.getElementById('det').innerHTML=''
  document.getElementById('lst').innerHTML=''
  for(var i=0;i<LS.length;i++) {
    document.getElementById('lst').innerHTML+='<h2>'+es(LS[i].l)+'</h2><div class="row" id="r'+i+'"><div class="loading">Đang tải...</div></div>'
    lr(i)
  }
}

function lr(i) {
  var p=LS[i].t==='phim-moi-cap-nhat'?'/danh-sach/phim-moi-cap-nhat?page=1&limit=10':'/v1/api/danh-sach/'+LS[i].t+'?page=1&limit=10'
  xhr('https://ophim1.com'+p,function(e,d){
    var el=document.getElementById('r'+i);if(!el)return
    if(e||!d){el.innerHTML='<div class="err">Lỗi tải</div>';return}
    var it=d.items||(d.data&&d.data.items)||[]
    if(!it.length){el.innerHTML='';return}
    el.innerHTML=it.map(function(m){
      return '<div class="card" onclick="od(\''+es(m.slug)+'\')"><img src="'+im(m.poster_url||m.thumb_url||m.thumb||m.poster)+'" onerror="this.style.display=\'none\'"><div class="nm">'+es(m.name||'')+'</div><div class="yr">'+(m.year||'')+'</div></div>'
    }).join('')
  })
}

function od(s) {
  document.getElementById('lst').innerHTML='<div class="loading">Đang tải...</div>'
  xhr('https://ophim1.com/phim/'+s,function(e,d){
    if(e||!d||!d.movie){
      document.getElementById('lst').innerHTML='<div class="err">Lỗi tải phim</div>';return
    }
    rd(d.movie,d.episodes||[])
  })
}

function rd(m,e) {
  var p=im(m.poster_url||m.thumb_url||m.poster||m.thumb)
  var tg=[m.year]
  if(m.quality)tg.push(m.quality)
  if(m.lang)tg.push(m.lang)
  if(m.time)tg.push(m.time)
  var h='<div id="det" class="show"><div class="bk" onclick="hm()">← Quay lại</div>'+
    '<img class="ps" src="'+p+'" onerror="this.style.display=\'none\'">'+
    '<h2>'+es(m.name||'')+'</h2><div class="mt">'+es(m.origin_name||'')+' • '+(m.year||'')+'</div>'+
    '<div class="tg">'+tg.filter(Boolean).map(function(t){return'<span>'+es(String(t))+'</span>'}).join('')+'</div>'+
    '<div class="dc">'+es(m.content||m.description||'')+'</div>'
  if(e.length) {
    for(var s=0;s<e.length;s++) {
      var d=e[s].server_data||[]
      h+='<div class="sv">'+es(e[s].server_name||'Server '+(s+1))+'</div><div class="eg">'
      for(var i=0;i<d.length;i++) {
        h+='<div class="ep" onclick="pe(\''+es(d[i].link_m3u8)+'\',\''+es(d[i].name||'Tập '+(i+1))+'\')">'+es(d[i].name||'Tập '+(i+1))+'</div>'
      }
      h+='</div>'
    }
  } else {
    h+='<div style="clear:both;color:#888;padding:16px 0;font-size:13px">Chưa có tập</div>'
  }
  h+='</div>'
  document.getElementById('lst').innerHTML=h
}

function pe(url, name) {
  if(!url)return
  var v=document.getElementById('pl')
  var w=document.getElementById('pw')
  w.className='show'

  // Destroy previous hls instance
  if(_hls){_hls.destroy();_hls=null}

  // Try hls.js first
  if(typeof Hls!=='undefined' && Hls.isSupported()) {
    _hls=new Hls()
    _hls.loadSource(url)
    _hls.attachMedia(v)
    _hls.on(Hls.Events.MANIFEST_PARSED,function(){v.play()})
  }
  // Native HLS support (Safari, some smart TVs)
  else if(v.canPlayType('application/vnd.apple.mpegurl')) {
    v.src=url
    v.play()
  }
  // Fallback: try direct src anyway
  else {
    v.src=url
    v.play()
  }
}

function xp() {
  if(_hls){_hls.destroy();_hls=null}
  var v=document.getElementById('pl'),w=document.getElementById('pw')
  v.pause()
  v.removeAttribute('src')
  w.className=''
}

hm()
</script>
</body>
</html>
