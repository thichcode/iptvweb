name: Release APK
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Custom tag (e.g. v1.0.0). Default: auto'
        required: false
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '21' }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true
      - run: npm ci
      - run: npm run build
      - name: Add Android platform
        run: node node_modules/.bin/cap add android
      - name: Sync web to Android
        run: node node_modules/.bin/cap sync android
      - name: Copy app icon
        run: |
          cp assets/app-icon.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp assets/app-icon.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp assets/app-icon.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp assets/app-icon.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp assets/app-icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp assets/app-icon.png android/app/src/main/res/mipmap-hdpi/ic_launcher_foreground.png
          cp assets/app-icon.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_foreground.png
          cp assets/app-icon.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_foreground.png
      - name: Fix adaptive icon (use PNG foreground)
        run: rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_foreground.xml
      - name: Copy TV banner
        run: |
          for dir in mipmap-hdpi mipmap-mdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            cp assets/tv_banner.png android/app/src/main/res/$dir/tv_banner.png
          done
      - name: Patch for Android TV
        run: |
          M="android/app/src/main/AndroidManifest.xml"
          sed -i 's|</manifest>|  <uses-feature android:name="android.hardware.touchscreen" android:required="false" />\n  <uses-feature android:name="android.software.leanback" android:required="false" />\n  <uses-feature android:name="android.hardware.screen.landscape" android:required="false" />\n</manifest>|' "$M"
          sed -i 's|android:supportsRtl="true"|android:supportsRtl="true"\n        android:banner="@drawable/tv_banner"|' "$M"
          sed -i 's|android:exported="true"|android:exported="true"\n            android:resizeableActivity="true"|' "$M"
          sed -i 's|<category android:name="android.intent.category.LAUNCHER" />|<category android:name="android.intent.category.LAUNCHER" />\n                <category android:name="android.intent.category.LEANBACK_LAUNCHER" />|' "$M"
          cp assets/tv_banner.png android/app/src/main/res/drawable/tv_banner.png
      - name: Patch UpdatePlugin and FileProvider
        run: |
          mkdir -p android/app/src/main/res/xml
          cp android-template/res/xml/file_paths.xml android/app/src/main/res/xml/file_paths.xml
          mkdir -p android/app/src/main/java/com/webphim/app
          sed 's/__PACKAGE_NAME__/package com.webphim.app;/' android-template/UpdatePlugin.java > android/app/src/main/java/com/webphim/app/UpdatePlugin.java
          ACT="android/app/src/main/java/com/webphim/app/MainActivity.java"
          if [ -f "$ACT" ]; then
            sed -i 's/public class MainActivity extends BridgeActivity {/public class MainActivity extends BridgeActivity {\n    @Override\n    public void onCreate(android.os.Bundle savedInstanceState) {\n        registerPlugin(UpdatePlugin.class);\n        super.onCreate(savedInstanceState);\n    }/' "$ACT"
          fi
          M="android/app/src/main/AndroidManifest.xml"
          sed -i 's|</manifest>|  <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n</manifest>|' "$M"
          PROVIDER='<provider android:name="androidx.core.content.FileProvider" android:authorities="${applicationId}.fileprovider" android:exported="false" android:grantUriPermissions="true"><meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/file_paths" /></provider>'
          sed -i "s|</application>|    $PROVIDER\n  </application>|" "$M"
      - name: Patch build.gradle with signing config
        run: |
          sed -i '/^android {/a\    signingConfigs {\n        debug {\n            storeFile file("../../certs/debug.keystore")\n            storePassword "android"\n            keyAlias "androiddebugkey"\n            keyPassword "android"\n        }\n    }' android/app/build.gradle
          sed -i '/buildTypes {/a\        debug {\n            signingConfig signingConfigs.debug\n        }' android/app/build.gradle
      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk WebPhim.apk
      - uses: actions/upload-artifact@v4
        with:
          name: webphim-apk
          path: WebPhim.apk

  build-tv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '21' }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true
      - run: npm ci
      - name: Build TV web assets
        run: |
          npm run build:tv
          sed -i 's|<head>|<head><script>window.__PLATFORM__="tv"</script>|' dist-tv/index.html
      - name: Use TV config
        run: cp capacitor.config.tv.json capacitor.config.json
      - name: Add Android TV platform
        run: node node_modules/.bin/cap add android
      - name: Sync web to Android TV
        run: node node_modules/.bin/cap sync android
      - name: Copy app icon
        run: |
          R=android/app/src/main/res
          for dir in mipmap-hdpi mipmap-mdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            cp assets/app-icon.png $R/$dir/ic_launcher.png
            cp assets/app-icon.png $R/$dir/ic_launcher_foreground.png
          done
          rm -f $R/mipmap-anydpi-v26/ic_launcher_foreground.xml
      - name: Copy TV banner
        run: |
          R=android/app/src/main/res
          for dir in mipmap-hdpi mipmap-mdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            cp assets/tv_banner.png $R/$dir/tv_banner.png
          done
          cp assets/tv_banner.png $R/drawable/tv_banner.png
      - name: Patch for Android TV
        run: |
          M="android/app/src/main/AndroidManifest.xml"
          sed -i 's|</manifest>|  <uses-feature android:name="android.hardware.touchscreen" android:required="false" />\n  <uses-feature android:name="android.software.leanback" android:required="false" />\n  <uses-feature android:name="android.hardware.screen.landscape" android:required="false" />\n</manifest>|' "$M"
          sed -i 's|android:supportsRtl="true"|android:supportsRtl="true"\n        android:banner="@drawable/tv_banner"|' "$M"
          sed -i 's|android:exported="true"|android:exported="true"\n            android:resizeableActivity="true"|' "$M"
          sed -i 's|<category android:name="android.intent.category.LAUNCHER" />|<category android:name="android.intent.category.LAUNCHER" />\n                <category android:name="android.intent.category.LEANBACK_LAUNCHER" />|' "$M"
      - name: Patch UpdatePlugin and FileProvider for TV
        run: |
          mkdir -p android/app/src/main/res/xml
          cp android-template/res/xml/file_paths.xml android/app/src/main/res/xml/file_paths.xml
          mkdir -p android/app/src/main/java/com/webphim/tv
          sed 's/__PACKAGE_NAME__/package com.webphim.tv;/' android-template/UpdatePlugin.java > android/app/src/main/java/com/webphim/tv/UpdatePlugin.java
          ACT="android/app/src/main/java/com/webphim/tv/MainActivity.java"
          if [ -f "$ACT" ]; then
            sed -i 's/public class MainActivity extends BridgeActivity {/public class MainActivity extends BridgeActivity {\n    @Override\n    public void onCreate(android.os.Bundle savedInstanceState) {\n        registerPlugin(UpdatePlugin.class);\n        super.onCreate(savedInstanceState);\n    }/' "$ACT"
          fi
          M="android/app/src/main/AndroidManifest.xml"
          sed -i 's|</manifest>|  <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n</manifest>|' "$M"
          PROVIDER='<provider android:name="androidx.core.content.FileProvider" android:authorities="${applicationId}.fileprovider" android:exported="false" android:grantUriPermissions="true"><meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/file_paths" /></provider>'
          sed -i "s|</application>|    $PROVIDER\n  </application>|" "$M"
      - name: Patch build.gradle with signing config
        run: |
          G=android/app/build.gradle
          sed -i '/^android {/a\    signingConfigs {\n        debug {\n            storeFile file("../../certs/debug.keystore")\n            storePassword "android"\n            keyAlias "androiddebugkey"\n            keyPassword "android"\n        }\n    }' "$G"
          sed -i '/buildTypes {/a\        debug {\n            signingConfig signingConfigs.debug\n        }' "$G"
      - name: Build TV APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Rename TV APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk WebPhimTV.apk
      - uses: actions/upload-artifact@v4
        with:
          name: webphim-tv-apk
          path: WebPhimTV.apk

  release:
    needs: [build, build-tv]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Set tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.version }}"
          if [ -z "$TAG" ]; then TAG="build-${{ github.run_number }}"; fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: artifacts/*/*.apk
          generate_release_notes: true
          make_latest: true
